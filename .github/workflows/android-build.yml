name: Build CODEX Storm APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java JDK
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    shell: bash
    run: |
      set -e
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

      yes | sdkmanager --licenses >/dev/null || true

  - name: Locate Android project
    shell: bash
    run: |
      set -e

      if [ -f "app/build.gradle.kts" ]; then
        echo "PROJECT_DIR=." >> "$GITHUB_ENV"
        exit 0
      fi

      ZIP_FILE="$(find . -maxdepth 3 -type f \
        -iname '*.zip' \
        -not -path './.git/*' | head -n 1)"

      if [ -z "$ZIP_FILE" ]; then
        echo "::error::File ZIP project tidak ditemukan."
        exit 1
      fi

      echo "ZIP ditemukan: $ZIP_FILE"
      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted

      SETTINGS_FILE="$(find extracted -type f \
        -name 'settings.gradle.kts' | head -n 1)"

      if [ -z "$SETTINGS_FILE" ]; then
        echo "::error::settings.gradle.kts tidak ditemukan."
        exit 1
      fi

      PROJECT_PATH="${SETTINGS_FILE%/settings.gradle.kts}"

      if [ ! -f "$PROJECT_PATH/app/build.gradle.kts" ]; then
        echo "::error::Folder app atau build.gradle.kts tidak ditemukan."
        find extracted -maxdepth 5 -type f | head -n 100
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_PATH" >> "$GITHUB_ENV"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check project configuration
    shell: bash
    run: |
      set -e
      cd "$PROJECT_DIR"
      echo "Project directory: $(pwd)"
      echo "Gradle files:"
      find . -maxdepth 3 \
        -name '*.gradle' -o -name '*.gradle.kts' \
        -type f

  - name: Build debug APK
    shell: bash
    run: |
      set -e
      cd "$PROJECT_DIR"
      gradle --no-daemon assembleDebug

  - name: Verify APK
    shell: bash
    run: |
      set -e
      APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -f "$APK" ]; then
        echo "::error::Build selesai tetapi APK tidak ditemukan."
        find "$PROJECT_DIR/app/build/outputs" \
          -type f 2>/dev/null || true
        exit 1
      fi

      ls -lh "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: CODEX-Storm-debug-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
